<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- PolarSurge mark: two pistons facing each other with a north star
       between their crowns. Ice blue = the North; heat orange = combustion.
       Founder-approved 2026-09-27 (see the hold list in CLAUDE.md). -->
  <!-- Left piston: skirt outboard, crown facing the centre -->
  <path d="M2 17 H22 V47 H2 V41 H8 V23 H2 Z" fill="#dbe9f5"/>
  <rect x="12" y="17" width="2" height="30" fill="#0b0f1c"/>
  <rect x="16" y="17" width="2" height="30" fill="#0b0f1c"/>
  <!-- Right piston, mirrored -->
  <path d="M62 17 H42 V47 H62 V41 H56 V23 H62 Z" fill="#dbe9f5"/>
  <rect x="50" y="17" width="2" height="30" fill="#0b0f1c"/>
  <rect x="46" y="17" width="2" height="30" fill="#0b0f1c"/>
  <!-- Combustion glow on both crown faces -->
  <rect x="22" y="19" width="2.5" height="26" fill="#ff7a1a"/>
  <rect x="39.5" y="19" width="2.5" height="26" fill="#ff7a1a"/>
  <!-- North star between the crowns, taller than the pistons -->
  <path d="M32 4 L35 29 L40.5 32 L35 35 L32 60 L29 35 L23.5 32 L29 29 Z" fill="#1f6f9a"/>
  <path d="M32 4 L35 29 L40.5 32 L29 29 Z" fill="#6ee7ff"/>
  <path d="M32 4 L29 29 L23.5 32 L35 29 Z" fill="#a9f0ff" opacity="0.9"/>
</svg>
